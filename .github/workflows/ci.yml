name: CI / CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      # Unit, module-boundary and Testcontainers (real PostgreSQL) tests
      - run: mvn -B verify

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false

  images:
    if: github.event_name == 'push'
    needs: [api, web]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: sevadesk-api, context: api }
          - { name: sevadesk-web, context: web }
          - { name: sevadesk-backup, context: infra/backup }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/sevadesk-staging
            git pull --ff-only
            TAG=main docker compose -f docker-compose.prod.yml --env-file .env pull
            TAG=main docker compose -f docker-compose.prod.yml --env-file .env up -d
            docker image prune -f

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-latest
    # Add required reviewers to the "production" environment in GitHub settings for a manual approval step.
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/sevadesk
            git fetch --tags && git checkout ${{ github.ref_name }}
            TAG=${{ github.ref_name }} docker compose -f docker-compose.prod.yml --env-file .env pull
            TAG=${{ github.ref_name }} docker compose -f docker-compose.prod.yml --env-file .env up -d
            docker image prune -f
