spring:
  application:
    name: sevadesk-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sevadesk}
    # The app connects as a non-owner role so PostgreSQL row-level security always applies.
    username: ${DB_APP_USER:sevadesk_app}
    password: ${DB_APP_PASSWORD:app_dev_password}
    # A small pool is plenty for one temple VM and keeps both the JVM and PostgreSQL lighter (default is 10).
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
  flyway:
    # Migrations run as the schema owner, on their own connection.
    url: ${spring.datasource.url}
    user: ${DB_OWNER_USER:sevadesk}
    password: ${DB_OWNER_PASSWORD:owner_dev_password}
    locations: classpath:db/migration,classpath:db/tenants
    placeholders:
      appRole: ${DB_APP_USER:sevadesk_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  forward-headers-strategy: framework
  shutdown: graceful

sevadesk:
  tenancy:
    # Hosts under these domains resolve the tenant from the first label: radhagovinda.sevadesk.app
    base-domains: ${BASE_DOMAINS:sevadesk.app,localhost}
    # Tenant used for a bare base domain such as "localhost" (dev only). Empty = none.
    default-slug: ${DEFAULT_TENANT_SLUG:}
  mail:
    # Sender for password links. Email is off until SMTP is configured with the standard Spring settings
    # (SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD) and this address is set.
    from: ${MAIL_FROM:}
    # Development only: write password links to the log so they can be tested without email.
    log-links: false
  bootstrap:
    # Creates the first admin login for a temple on startup, only if that temple has no users yet.
    tenant-slug: ${BOOTSTRAP_TENANT_SLUG:}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET}
    ttl: 8h
  cookie:
    secure: ${COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# API docs are switched on in the dev profile only (application-dev.yml).
springdoc:
  swagger-ui:
    enabled: false
    path: /api/docs
  api-docs:
    enabled: false
    path: /api/docs/openapi
