<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{site/layout :: head(${temple.name}, ${site.heroText} ?: ${temple.tagline})}"></head>
<body>
<header th:replace="~{site/layout :: header}"></header>

<main>
  <section class="hero">
    <div class="wrap hero-inner">
      <p class="eyebrow" th:text="${temple.greeting}">Hare Krishna</p>
      <h1 th:text="${site.heroTitle} ?: ${temple.name}">Welcome</h1>
      <p class="lead" th:if="${site.heroText}" th:text="${site.heroText}">Intro</p>
      <div class="actions">
        <a class="btn" href="/events">See upcoming events</a>
        <a class="btn ghost" href="/donate" th:if="${site.pages.containsKey('donate')}">Donate</a>
      </div>
    </div>
  </section>

  <div class="mantra" th:if="${site.mantra}" aria-label="Maha mantra">
    <div class="track">
      <span th:text="${site.mantra}">Mantra</span><span th:text="${site.mantra}" aria-hidden="true">Mantra</span>
    </div>
  </div>

  <section class="wrap section" id="events">
    <div class="section-head">
      <h2>Upcoming Events</h2>
      <a href="/events">All events →</a>
    </div>
    <div class="event-grid" th:unless="${events.isEmpty()}">
      <a class="event-card" th:each="e : ${events}" th:href="@{/events/{s}(s=${e.slug})}">
        <div class="date"><b th:text="${fmt.day(e.startsAt)}">8</b><span th:text="${fmt.month(e.startsAt)}">Nov</span></div>
        <div>
          <h3 th:text="${e.title}">Event</h3>
          <p class="when" th:text="${fmt.time(e.startsAt)} + (${e.location} != null ? ' · ' + ${e.location} : '')">10:00 AM</p>
          <p th:if="${e.summary}" th:text="${e.summary}">Summary</p>
        </div>
      </a>
    </div>
    <p class="muted" th:if="${events.isEmpty()}">New events will be announced here soon. Subscribe on the <a href="/contact-us">contact page</a> to hear first.</p>
  </section>

  <section class="quote" th:if="${site.quote}">
    <div class="wrap">
      <blockquote th:text="${site.quote}">Quote</blockquote>
      <cite th:if="${site.quoteSource}" th:text="${site.quoteSource}">Source</cite>
    </div>
  </section>

  <section class="wrap section welcome" th:if="${site.welcomeTitle}">
    <h2 th:text="${site.welcomeTitle}">Welcome</h2>
    <p th:text="${site.welcomeText}">Text</p>
  </section>

  <section class="wrap section" th:unless="${site.initiatives.isEmpty()}">
    <h2>Current Initiatives</h2>
    <div class="cards">
      <article class="card" th:each="c : ${site.initiatives}">
        <h3 th:text="${c.title}">Initiative</h3>
        <p th:text="${c.text}">Text</p>
        <a th:if="${c.href}" th:href="${c.href}">Learn more →</a>
      </article>
    </div>
  </section>
</main>

<footer th:replace="~{site/layout :: footer}"></footer>

<script type="application/ld+json" th:utext="${jsonLd}"></script>
</body>
</html>
