# Local development: `mvn spring-boot:run -Dspring-boot.run.profiles=dev`
spring:
  config:
    # Your own Stripe test keys etc. for local development (not in Git). Copy local-secrets.properties.example.
    import: optional:file:../local-secrets.properties
  flyway:
    locations: classpath:db/migration,classpath:db/tenants,classpath:db/dev
    # dev databases created before a newer V2 migration still pick it up
    out-of-order: true

sevadesk:
  tenancy:
    default-slug: iskconsomerset
  jwt:
    secret: dev-only-secret-change-me-0123456789abcdef
  cookie:
    secure: false
  mail:
    log-links: true
  dev:
    # Seeded for every demo tenant by DevDataSeeder. Development only.
    admin-email: admin@demo.local
    admin-password: ChangeMe-dev-only

logging:
  level:
    com.sevadesk: debug
